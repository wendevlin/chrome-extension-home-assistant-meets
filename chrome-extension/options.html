<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Google Meets HA - Einstellungen</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      color: #333;
      font-size: 24px;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: #555;
    }
    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #4CAF50;
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #45a049;
    }
    .help-text {
      font-size: 12px;
      color: #777;
      margin-top: 5px;
    }
    .status {
      padding: 10px;
      margin-top: 20px;
      border-radius: 4px;
      display: none;
    }
    .status.success {
      background-color: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
    }
    .status.error {
      background-color: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
    }
    code {
      background-color: #f4f4f4;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h1>Google Meets Home Assistant Integration</h1>

  <div class="form-group">
    <label for="haUrl">Home Assistant WebSocket URL</label>
    <input type="text" id="haUrl" placeholder="ws://homeassistant.local:8123/api/websocket">
    <div class="help-text">
      Standard: <code>ws://homeassistant.local:8123/api/websocket</code><br>
      Für HTTPS: <code>wss://your-domain.com/api/websocket</code>
    </div>
  </div>

  <div class="form-group">
    <label for="accessToken">Long-Lived Access Token</label>
    <input type="password" id="accessToken" placeholder="Dein Home Assistant Access Token">
    <div class="help-text">
      Erstelle ein Token in Home Assistant unter:<br>
      Profil → Sicherheit → Long-Lived Access Tokens → Token erstellen
    </div>
  </div>

  <button id="save">Einstellungen speichern</button>

  <div id="status" class="status"></div>
</body>
<script src="options.js"></script>
</html>
